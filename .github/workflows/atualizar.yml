name: Atualizar lista M3U

on:
  schedule:
    # GitHub Actions usa UTC.
    # 00, 06, 12 e 18 UTC = 21, 03, 09 e 15 no horário de Brasília
    # durante UTC-3. O horário exato pode variar conforme o fuso/horário legal.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar M3U
        env:
          USE_BROWSER: auto
          HTTP_TIMEOUT: "25"
          HTTP_RETRIES: "3"
          WORKERS: "8"
        run: |
          python gerar_m3u.py

      - name: Mostrar resultado
        run: |
          echo "---- canais.m3u ----"
          grep -c '^#EXTINF:' canais.m3u || true
          echo "---- status ----"
          cat status.json

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add canais.m3u status.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Atualiza lista M3U"
            git push
          fi
